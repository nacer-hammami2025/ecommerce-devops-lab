name: Full DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # =====================================
  # 1. TERRAFORM INFRASTRUCTURE
  # =====================================
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      instance_ips: ${{ steps.export.outputs.instance_ips }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Clean Orphaned AWS Resources
        run: |
          echo "🧹 Terminating all running instances..."
          for INSTANCE_ID in $(aws ec2 describe-instances --filters "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null); do
            echo "Terminating: $INSTANCE_ID"
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" 2>/dev/null || true
          done
          
          echo "⏳ Waiting 90 seconds for instances to terminate..."
          sleep 90
          
          echo "🗑️ Deleting ALB (ecommerce-prod-alb)..."
          ALB_ARN=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[?LoadBalancerName==`ecommerce-prod-alb`].LoadBalancerArn' --output text 2>/dev/null)
          if [ ! -z "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then 
            echo "Deleting ALB: $ALB_ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" 2>/dev/null || true
          fi
          
          echo "⏳ Sleeping 15 seconds before target group deletion..."
          sleep 15
          
          echo "🗑️ Deleting Target Group (ecommerce-prod-tg)..."
          TG_ARN=$(aws elbv2 describe-target-groups --query 'TargetGroups[?TargetGroupName==`ecommerce-prod-tg`].TargetGroupArn' --output text 2>/dev/null)
          if [ ! -z "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then 
            echo "Deleting TG: $TG_ARN"
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
          fi
          
          echo "🗑️ Deleting Security Groups (ecommerce-prod-alb-sg, ecommerce-prod-ec2-sg)..."
          for SG_NAME in ecommerce-prod-alb-sg ecommerce-prod-ec2-sg; do
            SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)
            if [ ! -z "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              echo "Deleting SG: $SG_NAME ($SG_ID)"
              aws ec2 delete-security-group --group-id "$SG_ID" 2>/dev/null || true
            fi
          done
          
          echo "🗑️ Deleting IAM resources..."
          aws iam remove-role-from-instance-profile --instance-profile-name ecommerce-prod-app-profile --role-name ecommerce-prod-app-role 2>/dev/null || true
          aws iam delete-instance-profile --instance-profile-name ecommerce-prod-app-profile 2>/dev/null || true
          aws iam list-role-policies --role-name ecommerce-prod-app-role --query 'PolicyNames[]' --output text 2>/dev/null | xargs -I {} aws iam delete-role-policy --role-name ecommerce-prod-app-role --policy-name {} 2>/dev/null || true
          aws iam delete-role --role-name ecommerce-prod-app-role 2>/dev/null || true
          
          echo "✅ Cleanup complete!"
        continue-on-error: true

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export Instance IPs
        id: export
        run: |
          IPS=$(terraform output -json instance_public_ips | jq -r '.[]' | tr '\n' ',' )
          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT
          echo "Exported IPs: $IPS"

  # =====================================
  # 2. ANSIBLE CONFIGURATION
  # =====================================
  ansible:
    name: Configure Servers
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Ansible & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible jq openssh-client

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          # Write SSH key very carefully
          cat > ~/.ssh/ec2_key.pem << 'EOF'
          ${{ secrets.EC2_KEY }}
          EOF
          chmod 600 ~/.ssh/ec2_key.pem
          
          echo "========================================"
          echo "✅ SSH Key Configuration"
          echo "========================================"
          echo "Key file size: $(wc -c < ~/.ssh/ec2_key.pem) bytes"
          echo "Key file permissions:"
          ls -la ~/.ssh/ec2_key.pem
          
          echo ""
          echo "Key header:"
          head -1 ~/.ssh/ec2_key.pem
          echo ""
          echo "Key footer:"
          tail -1 ~/.ssh/ec2_key.pem
          
          # Validate key format
          if head -1 ~/.ssh/ec2_key.pem | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "✅ Valid private key format"
            KEY_TYPE=$(head -1 ~/.ssh/ec2_key.pem)
            echo "Key type: $KEY_TYPE"
          else
            echo "❌ INVALID KEY FORMAT!"
            echo "First 5 lines of key:"
            head -5 ~/.ssh/ec2_key.pem
            exit 1
          fi
          
          # Try to generate public key from private key
          echo ""
          echo "Generating public key from private key..."
          if ssh-keygen -y -f ~/.ssh/ec2_key.pem > ~/.ssh/ec2_key.pub 2>&1; then
            echo "✅ Public key successfully generated"
            wc -c < ~/.ssh/ec2_key.pub
          else
            echo "⚠️ Could not generate public key - key may be invalid"
            cat ~/.ssh/ec2_key.pub
          fi

      - name: SSH Agent Setup
        run: |
          # Start SSH agent and add key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/ec2_key.pem
          echo "✅ SSH agent initialized with key"
          ssh-add -l

      - name: Wait for SSH Readiness
        run: |
          echo "========================================"
          echo "🔐 SSH Connectivity Test"
          echo "========================================"
          
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            if [ -z "$ip" ]; then
              echo "⚠️ Skipping empty IP"
              continue
            fi
            
            echo ""
            echo "═══════════════════════════════════════════"
            echo "Target: ubuntu@$ip"
            echo "═══════════════════════════════════════════"
            
            # Pre-flight checks
            echo "📋 Pre-flight checks:"
            echo "  - Key exists: $([ -f ~/.ssh/ec2_key.pem ] && echo YES || echo NO)"
            echo "  - Key readable: $([ -r ~/.ssh/ec2_key.pem ] && echo YES || echo NO)"
            echo "  - Key permissions: $(stat -c %a ~/.ssh/ec2_key.pem 2>/dev/null || stat -f %A ~/.ssh/ec2_key.pem)"
            
            # SSH connectivity loop
            SSH_SUCCESS=0
            for attempt in {1..25}; do
              echo ""
              echo "[Attempt $attempt/25] Connecting to ubuntu@$ip"
              
              # Verbose output on first 3 attempts
              if [ $attempt -le 3 ]; then
                echo "🔍 Detailed SSH output:"
                ssh -vvv -i ~/.ssh/ec2_key.pem \
                  -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=10 \
                  -o BatchMode=yes \
                  -o PubkeyAuthentication=yes \
                  ubuntu@$ip "echo 'SSH CONNECTION SUCCESS' && uname -a" 2>&1 | tee /tmp/ssh_verbose.log
              else
                ssh -i ~/.ssh/ec2_key.pem \
                  -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=10 \
                  -o BatchMode=yes \
                  -o PubkeyAuthentication=yes \
                  ubuntu@$ip "echo 'SSH CONNECTION SUCCESS'" 2>&1
              fi
              
              if [ $? -eq 0 ]; then
                echo "✅ SSH SUCCESSFUL on ubuntu@$ip"
                SSH_SUCCESS=1
                break
              else
                echo "❌ SSH failed (attempt $attempt/25)"
                if [ $attempt -eq 3 ]; then
                  echo "📊 Diagnostic info from verbose attempt:"
                  grep -i "auth\|permission\|denied\|key" /tmp/ssh_verbose.log || echo "No diagnostic info found"
                fi
              fi
              
              if [ $attempt -lt 25 ]; then
                WAIT_TIME=$((10 + attempt))
                echo "⏳ Waiting $WAIT_TIME seconds before retry..."
                sleep $WAIT_TIME
              fi
            done
            
            if [ $SSH_SUCCESS -eq 0 ]; then
              echo ""
              echo "⚠️ SSH CONNECTION FAILED FOR $ip after 25 attempts"
              echo "Possible causes:"
              echo "  1. Wrong SSH key (EC2_KEY secret may not match instance key pair)"
              echo "  2. Security group not allowing port 22"
              echo "  3. Instance still initializing"
              echo ""
              exit 1
            fi
          done
          echo ""
          echo "✅ All instances are SSH-reachable"

      - name: Generate Inventory
        run: |
          echo "[web]" > inventory.ini
          echo "" >> inventory.ini
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            if [ ! -z "$ip" ]; then
              echo "$ip ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ec2_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' ansible_python_interpreter=/usr/bin/python3" >> inventory.ini
            fi
          done
          echo "" >> inventory.ini
          echo "[all:vars]" >> inventory.ini
          echo "ansible_host_key_checking=False" >> inventory.ini
          echo "ansible_ssh_retries=5" >> inventory.ini
          echo "ansible_ssh_timeout=30" >> inventory.ini
          echo "" >> inventory.ini
          echo "✅ Generated Inventory:"
          cat inventory.ini

      - name: Run Ansible Playbook - Deploy
        run: |
          echo "========================================"
          echo "💭 Ansible Playbook Execution"
          echo "========================================"
          echo ""
          echo "📋 Inventory:"
          cat inventory.ini
          echo ""
          echo "🔐 Testing Ansible connectivity..."
          ansible all -i inventory.ini -m ping -vvv 2>&1 | tee /tmp/ansible_ping.log
          
          PING_RESULT=$?
          if [ $PING_RESULT -ne 0 ]; then
            echo ""
            echo "⚠️ Ansible ping test FAILED"
            echo "Diagnostic output:"
            grep -i "error\|failed\|refused\|permission\|denied" /tmp/ansible_ping.log || echo "No specific errors found"
            echo ""
            echo "Continuing with playbook execution anyway..."
          else
            echo "✅ Ansible ping successful - instances are reachable"
          fi
          
          echo ""
          echo "🚀 Running Ansible Playbook..."
          ansible-playbook -i inventory.ini ansible/deploy.yml -vvv 2>&1 | tee /tmp/ansible_playbook.log
          
          PLAYBOOK_RESULT=$?
          if [ $PLAYBOOK_RESULT -eq 0 ]; then
            echo "✅ Ansible playbook completed successfully"
          else
            echo "❌ Ansible playbook FAILED with exit code $PLAYBOOK_RESULT"
            echo ""
            echo "Last 50 lines of playbook output:"
            tail -50 /tmp/ansible_playbook.log
            exit $PLAYBOOK_RESULT
          fi
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_RETRIES: "5"
          ANSIBLE_SSH_TIMEOUT: "30"
          ANSIBLE_GATHER_TIMEOUT: "30"
          ANSIBLE_STDOUT_CALLBACK: "actionable"
          ANSIBLE_DEPRECATION_WARNINGS: "False"

      - name: Verify Deployment
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            if [ ! -z "$ip" ]; then
              echo "Testing connectivity to $ip..."
              curl -s -o /dev/null -w "%{http_code}" http://$ip:80 || echo "Service not yet ready"
            fi
          done

      - name: Test Application HTTP - Proof of Functionality ✅
        run: |
          echo "🌐 Testing HTTP Connectivity to Application..."
          echo "=============================================="
          
          # Get first instance IP
          FIRST_IP=$(echo "${{ needs.terraform.outputs.instance_ips }}" | cut -d',' -f1)
          
          if [ ! -z "$FIRST_IP" ]; then
            echo "📍 Testing IP: $FIRST_IP"
            echo ""
            
            # Test HTTP GET request
            echo "🔍 Testing HTTP GET / endpoint..."
            HTTP_CODE=$(curl -s -o /tmp/response.html -w "%{http_code}" "http://$FIRST_IP/" --max-time 15)
            echo "HTTP Status Code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ SUCCESS! Application is responding with HTTP 200"
              echo ""
              echo "📄 HTML Response (first 50 lines):"
              echo "=================================="
              head -50 /tmp/response.html
              echo ""
              echo "=================================="
              echo ""
              echo "🎉 PROOF: Application is running and accessible at http://$FIRST_IP/"
            else
              echo "⚠️ Status code: $HTTP_CODE (expected 200)"
              cat /tmp/response.html || true
            fi
          else
            echo "❌ No instance IPs available"
          fi

  # =====================================
  # 3. OPTIONAL: TERRAFORM DESTROY
  # =====================================
  destroy:
    name: Destroy Infrastructure (Manual)
    if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.action, 'destroy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
